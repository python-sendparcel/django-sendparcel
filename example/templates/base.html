<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Demo SendParcel{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/htmx.org@1.9.12"
      integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
      crossorigin="anonymous"
    ></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="layout-fluid">
    <div class="page">
      <header class="navbar navbar-expand-md d-print-none">
        <div class="container-xl">
          <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-btn">
            <a href="{% url 'shipping:shipment_list' %}">Demo SendParcel</a>
          </h1>
          <div class="navbar-nav flex-row order-md-last">
            <span class="nav-link text-muted">Django + HTMX + Tabler</span>
          </div>
        </div>
      </header>
      <div class="page-wrapper">
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <h2 class="page-title">
                  {% block page_title %}{% endblock %}
                </h2>
              </div>
              <div class="col-auto ms-auto d-print-none">
                {% block page_actions %}{% endblock %}
              </div>
            </div>
          </div>
        </div>
        <div class="page-body">
          <div class="container-xl">
            {% if messages %}
              {% for message in messages %}
                <div
                  class="alert alert-{{ message.tags|default:'info' }} alert-dismissible"
                  role="alert"
                >
                  <div class="d-flex">
                    <div>{{ message }}</div>
                  </div>
                  <a
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"
                  ></a>
                </div>
              {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"
    ></script>
  </body>
</html>
