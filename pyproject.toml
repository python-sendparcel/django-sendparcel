[project]
name = "django-sendparcel"
version = "0.1.0"
description = "Django adapter for python-sendparcel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Dominik Kozaczko" }]
dependencies = [
    "Django>=5.2",
    "python-sendparcel>=0.1.0",
    "anyio>=4.0",
    "swapper>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-django>=4.9.0",
    "pytest-factoryboy>=2.7.0",
    "factory-boy>=3.3.0",
    "ruff>=0.9.0",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sendparcel_django"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
target-version = "py312"
line-length = 80
src = ["sendparcel_django", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["N818", "B027"]

[tool.ruff.lint.per-file-ignores]
"sendparcel_django/migrations/*" = ["RUF012"]
"example/*" = ["RUF012"]

[tool.uv.sources]
python-sendparcel = { path = "../python-sendparcel", editable = true }
